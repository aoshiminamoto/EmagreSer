# VPS (Hostinger): docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requer Docker Compose v2.24+ (diretiva !reset) e um .env com os segredos.
services:
  app:
    build:
      target: production
    env_file:
      - .env
    environment: !reset
      NODE_ENV: production
      PORT: 3000
      COOKIE_SECURE: 'true'
      HOST: 0.0.0.0
      # DATABASE_URL e REDIS_URL vêm do .env; no VPS use os serviços postgres/redis.
    ports: !reset []
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
