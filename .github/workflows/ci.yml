name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emagreser
          POSTGRES_USER: emagreser
          POSTGRES_PASSWORD: emagreser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emagreser -d emagreser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # DATABASE_URL é a única fonte da porta: 55432 no compose local, 5432 neste service.
      DATABASE_URL: postgresql://emagreser:emagreser@127.0.0.1:5432/emagreser
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Auditoria de dependências (sem vulnerabilidades altas)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run i18n:check
      - run: npm run build
      - name: Flags de desenvolvimento desligadas no build de produção
        run: npm run check:prod-env
        env:
          VITE_ALLOW_DESKTOP: ${{ vars.VITE_ALLOW_DESKTOP }}
          VITE_FORCE_LOCALES: ${{ vars.VITE_FORCE_LOCALES }}
